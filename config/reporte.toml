# Configuracion del reporte de gastos (reporte.py).
# Se edita sin tocar codigo: cambiar umbrales o agregar palabras a una categoria.

[reporte]
# Minutos de diferencia para tomar una salida y una entrada del mismo monto en bancos
# distintos como transferencia entre cuentas propias (no es gasto ni ingreso).
ventana_transferencia_propia = 30
# Categorias que se muestran aparte y no se suman al gasto (ej. pagos de tarjeta sin detalle,
# que ya estan contados como compras).
excluir_del_gasto = ["Débitos de cuenta"]
# Una compra cuenta como "hormiga" si cuesta hasta este monto en colones...
umbral_hormiga = 5000
# ...y la misma categoria se repite al menos estas veces en el mes.
min_compras_hormiga = 4
# Un cobro es "suscripcion" si el mismo comercio aparece en al menos estos meses seguidos
# con un monto casi igual (variacion maxima en proporcion, 0.15 = 15 %).
meses_suscripcion = 3
variacion_suscripcion = 0.15
# Meses que muestra el grafico de tendencia.
meses_tendencia = 6

# Colones por unidad de cada moneda, para sumar todo en colones.
# Actualizar con el tipo de cambio de venta del BCCR.
[tipos_cambio]
USD = 505.0
EUR = 550.0
JPY = 3.4

# Categorias por tipo de movimiento (se revisan antes que las palabras).
[categorias_por_tipo]
sinpe_enviado = "Transferencias"
retiro_efectivo = "Efectivo"
debito_cuenta = "Débitos de cuenta"

# Categorias por palabras en el nombre del comercio (sin importar mayusculas ni tildes).
# Las palabras de 4 letras o menos tienen que aparecer como palabra completa ("UE" no choca con "BUEN").
# La primera categoria que coincide gana, asi que las mas especificas van primero
# (ej. "Viajes" va antes de "Combustible" para que la aerolinea Delta no cuente como gasolinera).
[[categorias]]
nombre = "Comida a domicilio"
palabras = ["UBER EATS", "UBEREATS", "UE", "RAPPI", "PEDIDOSYA", "DIDI FOOD"]

